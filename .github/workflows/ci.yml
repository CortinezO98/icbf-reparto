name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, fileinfo, zip, intl, gd
          coverage: none

      - name: Validate composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: |
          find app bin public routes tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Unit tests
        run: composer test

      - name: Static analysis
        run: composer analyse
