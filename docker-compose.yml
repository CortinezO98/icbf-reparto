services:
  nginx:
    image: nginx:1.27-alpine
    container_name: icbf-reparto-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8088:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - reparto_net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icbf-reparto-app
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - reparto_net
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(is_file(\"/var/www/html/public/index.php\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icbf-reparto-worker
    working_dir: /var/www/html
    env_file:
      - .env
    command: ["php", "bin/worker.php"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - reparto_net
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: icbf-reparto-db
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MARIADB_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: ${APP_TIMEZONE:-America/Bogota}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/50-server.cnf:/etc/mysql/mariadb.conf.d/50-server.cnf:ro
    networks:
      - reparto_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

networks:
  reparto_net:
    driver: bridge

volumes:
  db_data:
  vendor_data: